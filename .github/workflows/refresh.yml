name: refresh
on:
  schedule: [{ cron: '17 5 * * *' }] # every day, 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-starters.mjs
      - name: Commit if changed
        run: |
          git config user.name "starters-bot"
          git config user.email "starters-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Starters: $(date -u +%F)"
          git push
